name: Market API Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Wait for this commit to be LIVE
        run: |
          python - <<'PY'
          import json, os, sys, time
          from urllib.request import urlopen
          expected = os.environ["GITHUB_SHA"]
          url = "https://us-momentum-market-api.onrender.com/health"
          for attempt in range(60):
              try:
                  with urlopen(url, timeout=10) as response:
                      data = json.load(response)
                  deployed = data.get("commit")
                  if data.get("status") == "ok" and deployed == expected:
                      print("LIVE commit verified:", deployed)
                      sys.exit(0)
                  print(f"Waiting for Render deploy: expected={expected}, live={deployed}")
              except Exception as exc:
                  print("Health endpoint not ready:", str(exc))
              time.sleep(20)
          raise SystemExit("Timed out waiting for the exact GitHub commit to become LIVE")
          PY
  backtest:
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Five-year backtest (retry transient 502/503/504 only)
        run: |
          set -e
          echo "Single backtest request; no retry to avoid repeated provider load."
          code=$(curl --silent --show-error --max-time 600 --output backtest.json --write-out '%{http_code}' https://us-momentum-market-api.onrender.com/api/backtest)
          if [ "$code" != "200" ]; then
            echo "Backtest failed HTTP=$code; not retrying automatically."
            cat backtest.json || true
            exit 1
          fi
          python -c "import json; d=json.load(open('backtest.json')); assert d.get('status')=='ok' and d.get('months',0)>0,d; assert d.get('dataSymbolsCount',0)==25 and d.get('universeSize',0)==25,d; assert d.get('periodEnd','')[:7] < __import__('datetime').date.today().strftime('%Y-%m'),d; print('Backtest PASS'); print('Period:',d.get('periodStart'),'to',d.get('periodEnd')); print('Months:',d.get('months')); print('Total return:',d.get('totalReturnPct')); print('CAGR:',d.get('cagrPct')); print('SPY return:',d.get('spyReturnPct')); print('Max drawdown:',d.get('maxDrawdownPct')); print('Transaction cost:',d.get('transactionCost')); print('Data coverage:',d.get('dataSymbolsCount'),'/',d.get('universeSize')); print('Missing symbols:',sorted(set(d.get('universe',[]))-set(d.get('dataSymbols',[]))))"

  scan:
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate scanner data and market regime (only after backtest passes)
        run: |
          curl --silent --show-error --fail --max-time 300 https://us-momentum-market-api.onrender.com/api/scan --output scan.json
          python - <<'PY'
          import json
          d=json.load(open("scan.json"))
          assert d.get("stocks"), "Scanner returned no stocks"
          assert d.get("returnedCount",0)>0, d
          assert d.get("universeCount",0)>=d.get("returnedCount",0), d
          m=d.get("marketRegime") or {}
          assert m.get("state") in ("GREEN","YELLOW","RED"), m
          assert m.get("spyPrice") and m.get("spySMA50") and m.get("spySMA200"), m
          assert 0<=m.get("aboveSMA50Pct",-1)<=100, m
          assert d.get("fetchedAt") and d.get("source"), d
          if m["state"]=="RED":
            assert not any(s.get("status")=="ENTRY READY" for s in d["stocks"]), "RED regime contains ENTRY READY"
          print("SCAN PASS")
          print("Universe:",d["returnedCount"],"/",d["universeCount"])
          print("Regime:",m["state"],"SPY:",m["spyPrice"])
          print("Breadth > SMA50:",m["aboveSMA50Pct"],"%")
          print("Data timestamp:",d["fetchedAt"])
          ready=[s for s in d["stocks"] if s.get("status")=="ENTRY READY"]
          approaching=[s for s in d["stocks"] if s.get("status")=="APPROACHING"]
          print("ENTRY READY:",len(ready))
          for s in ready:
            print("READY:",s["symbol"],"score",s["score"],"price",s["price"],"entry",s["entry"],"stop",s["stop"],"target5R",s["target5R"],"RS3M",s["rs3m"],"vol",s["volumeRatio"])
          print("TOP APPROACHING:")
          for s in approaching[:10]:
            print("WATCH:",s["symbol"],"score",s["score"],"price",s["price"],"entry",s["entry"],"stop",s["stop"],"target5R",s["target5R"],"RS3M",s["rs3m"],"vol",s["volumeRatio"])
          PY
      - name: Save full scanner data
        uses: actions/upload-artifact@v4
        with:
          name: scanner-data
          path: scan.json
          retention-days: 14
