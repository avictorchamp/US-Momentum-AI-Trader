name: Market API Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Health check
        run: |
          curl --fail --silent --show-error --max-time 60 https://us-momentum-market-api.onrender.com/health | tee health.json
          python -c "import json; d=json.load(open('health.json')); assert d.get('status')=='ok',d; print('Health PASS:',d)"
      - name: Market scan
        run: |
          curl --fail --silent --show-error --max-time 180 https://us-momentum-market-api.onrender.com/api/scan | tee scan.json
          python -c "import json; d=json.load(open('scan.json')); assert d.get('stocks') and d.get('returnedCount',0)>0,d; print('Scan PASS:',d.get('returnedCount'),'stocks returned; top 5:',[(x['symbol'],x['score'],x['status']) for x in d['stocks'][:5]])"
      - name: Five-year backtest
        run: |
          curl --fail --silent --show-error --max-time 300 https://us-momentum-market-api.onrender.com/api/backtest | tee backtest.json
          python -c "import json; d=json.load(open('backtest.json')); assert d.get('status')=='ok' and d.get('months',0)>0,d; print('Backtest PASS'); print('Period:',d.get('periodStart'),'to',d.get('periodEnd)); print('Months:',d.get('months')); print('Strategy total return:',d.get('totalReturnPct')); print('Strategy CAGR:',d.get('cagrPct')); print('SPY return:',d.get('spyReturnPct')); print('Max drawdown:',d.get('maxDrawdownPct')); print('Final index:',d.get('finalIndex')); print('Universe size:',d.get('universeSize'))"
