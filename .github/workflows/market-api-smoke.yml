name: Market API Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for this commit to be LIVE
        run: |
          python - <<'PY'
          import json, os, sys, time
          from urllib.request import urlopen
          expected = os.environ["GITHUB_SHA"]
          url = "https://us-momentum-market-api.onrender.com/health"
          for attempt in range(40):
              try:
                  with urlopen(url, timeout=10) as response:
                      data = json.load(response)
                  deployed = data.get("commit")
                  if data.get("status") == "ok" and deployed == expected:
                      print("LIVE commit verified:", deployed)
                      sys.exit(0)
                  print(f"Waiting for Render deploy: expected={expected}, live={deployed}")
              except Exception as exc:
                  print("Health endpoint not ready:", str(exc))
              time.sleep(15)
          raise SystemExit("Timed out waiting for the exact GitHub commit to become LIVE")
          PY
  backtest:
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Five-year backtest
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 https://us-momentum-market-api.onrender.com/api/backtest -o backtest.json
          python -c "import json; d=json.load(open('backtest.json')); assert d.get('status')=='ok' and d.get('months',0)>0,d; assert d.get('dataSymbolsCount',0)==25 and d.get('universeSize',0)==25,d; assert d.get('periodEnd','')[:7] < __import__('datetime').date.today().strftime('%Y-%m'),d; print('Backtest PASS'); print('Period:',d.get('periodStart'),'to',d.get('periodEnd')); print('Months:',d.get('months')); print('Total return:',d.get('totalReturnPct')); print('CAGR:',d.get('cagrPct')); print('SPY return:',d.get('spyReturnPct')); print('Max drawdown:',d.get('maxDrawdownPct')); print('Transaction cost:',d.get('transactionCost')); print('Data coverage:',d.get('dataSymbolsCount'),'/',d.get('universeSize')); print('Missing symbols:',sorted(set(d.get('universe',[]))-set(d.get('dataSymbols',[]))))"
